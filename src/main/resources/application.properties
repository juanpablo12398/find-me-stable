# --- DB ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- MVC / i18n ---
spring.mvc.problemdetails.enabled=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- JWT ---
# Para HMAC256 usa >= 32 bytes. En prod NO uses el default.
jwt.secret=${JWT_SECRET:dev-secret-change-me-32-bytes-min}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.http-only=true
jwt.cookie.same-site=Lax

# --- CORS (custom; si los usas, configura un CorsConfigurationSource leyendo estas props) ---
cors.allowed-origins=${CORS_ORIGINS}
cors.allow-credentials=true
server.port=${PORT:8080}

# --- WEB ---
spring.mvc.contentnegotiation.favor-path-extension=false
spring.resources.chain.enabled=true

# --- FILE STORAGE ---
# Ruta base del almacenamiento de archivos.
# Default: ./storage (relativa al proyecto)
# Para pendrive: cambiar a E:/findme-storage/ (o la letra del drive)
findme.storage.root=./storage

# Tamanio maximo de archivo en MB
findme.storage.max-size-mb=10

# Spring: habilitar multipart y configurar Tamano maximo
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# --- COOKIE SEGURA ---
# En desarrollo: false. En produccion con HTTPS: true
security.cookie.secure=false
security.cookie.max-age-seconds=604800

# --- HSTS ---
# En desarrollo: false. En produccion con HTTPS: true
security.hsts.enabled=false

# --- URLs firmadas ---
# Tiempo de vida de una URL firmada (en segundos). Default: 120 (2 minutos)
security.signed-url.ttl-seconds=120
# Secret para HMAC (usa el mismo jwt.secret por defecto si no se define)
# security.signed-url.secret=${JWT_SECRET:dev-secret-change-me-32-bytes-min}

# --- Rate limiting por ruta ---
# Login: 5 intentos por IP por minuto (POST /api/auth/login)
security.rate-limit.login.max-requests=5
security.rate-limit.login.window-seconds=60
# Registro: 3 intentos por IP por hora (POST /api/avistadores)
security.rate-limit.registro.max-requests=3
security.rate-limit.registro.window-seconds=3600

# --- Cifrado AES-256-GCM ---
# Clave de 32 bytes en Base64. Generar con: openssl rand -base64 32
# NUNCA commitear en el repo. Usar variable de entorno.
security.encryption.key=${ENCRYPTION_KEY:generame-una-clave-con-openssl-rand-base64-32}

# --- HMAC para blind index ---
# Clave separada de la de cifrado (defense in depth).
# Generar con: openssl rand -base64 32
security.hmac.key=${HMAC_KEY:generame-otra-clave-con-openssl-rand-base64-32}

# --- Swagger / OpenAPI (springdoc) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.SQL=DEBUG

# --- Mail ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@findme.com}

# --- SMS (Twilio) ---
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
sms.enabled=${SMS_ENABLED:false}

# --- ACTUATOR ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=${MAIL_ENABLED:false}



