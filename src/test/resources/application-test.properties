# Database configuration for integration tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Hibernate DDL so it doesn't struggle with unsupported PostGIS annotations
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Avoid missing variables
JWT_SECRET=this-is-a-test-jwt-secret-that-must-be-32-chars-long
JWT_EXPIRATION_DAYS=1
CORS_ORIGINS=*
PORT=8080
ENCRYPTION_KEY=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
HMAC_KEY=MjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM=

# Reduce en los logs de los test de integracion
logging.level.root=ERROR
logging.level.edu.utn.proyecto.infrastructure.adapters.in.rest.exception.ApiExceptionHandler=OFF
logging.level.org.hibernate.dialect.Dialect=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration=ERROR

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.main.banner-mode=off
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Mail (deshabilitado en tests) ---
spring.mail.host=localhost
spring.mail.port=25
mail.enabled=false
sms.enabled=false
